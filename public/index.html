<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In the Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0e0d0b;
    --paper: #f5f0e8;
    --paper-dark: #ede8de;
    --accent: #c8372d;
    --muted: #7a7068;
    --card-bg: #ffffff;
    --border: rgba(14,13,11,0.12);
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  .masthead {
    border-bottom: 3px double var(--ink);
    padding: 1.2rem 2rem 1rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .masthead h1 {
    font-family: var(--serif);
    font-size: 2.6rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .masthead h1 span { color: var(--accent); }

  .masthead-meta {
    font-size: 0.72rem;
    color: var(--muted);
    text-align: right;
    font-weight: 300;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .ticker-bar {
    background: var(--ink);
    color: var(--paper);
    font-size: 0.72rem;
    padding: 0.4rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    overflow: hidden;
    white-space: nowrap;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .ticker-label {
    background: var(--accent);
    padding: 0.15rem 0.5rem;
    font-weight: 500;
    flex-shrink: 0;
    font-size: 0.65rem;
  }

  .ticker-content { overflow: hidden; flex: 1; }

  .ticker-text {
    display: inline-block;
    animation: ticker 50s linear infinite;
  }

  @keyframes ticker {
    0% { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
  }

  .filters {
    display: flex;
    gap: 0.5rem;
    padding: 0.8rem 2rem;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
  }

  .section-rule {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .section-rule span {
    font-family: var(--serif);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--muted);
  }

  .section-rule::before, .section-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 0;
    border: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .hero-card {
    padding: 1.75rem;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    transition: background 0.15s;
  }

  .hero-card:hover { background: var(--paper-dark); }

  .side-cards {
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
  }

  .side-card {
    padding: 1.2rem 1.4rem;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    transition: background 0.15s;
    flex: 1;
  }

  .side-card:hover { background: var(--paper-dark); }
  .side-card:last-child { border-bottom: none; }

  .tag {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    font-size: 0.62rem;
    font-weight: 500;
    padding: 0.2rem 0.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    align-self: flex-start;
  }

  .tag.world    { background: #1a4a7a; }
  .tag.business { background: #2d6a2d; }
  .tag.technology { background: #5a2d82; }
  .tag.health   { background: #7a2d2d; }
  .tag.science  { background: #2d5a6a; }
  .tag.sports   { background: #6a5a2d; }
  .tag.entertainment { background: #6a2d5a; }
  .tag.politics { background: var(--accent); }

  .hero-card .headline {
    font-family: var(--serif);
    font-size: 1.65rem;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  .side-card .headline {
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.35;
  }

  .grid-card .headline {
    font-family: var(--serif);
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .description {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.55;
    font-weight: 300;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .chinese-summary {
  font-size: 0.88rem;
  color: #3a3530;
  line-height: 1.6;
  font-weight: 400;
  padding: 0.5rem 0.75rem;
  border-left: 3px solid var(--accent);
  background: rgba(200, 55, 45, 0.05);
  margin: 0.25rem 0;
}

  .meta {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: auto;
    padding-top: 0.5rem;
    border-top: 1px solid var(--border);
  }

  .grid-section {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border: 1px solid var(--border);
    margin-bottom: 2rem;
    background: var(--card-bg);
  }

  .grid-card {
    padding: 1.2rem 1.3rem;
    border-right: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: background 0.15s;
  }

  .grid-card:hover { background: var(--paper-dark); }
  .grid-card:last-child { border-right: none; }

  .loading-state {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    flex-direction: column;
    gap: 1rem;
  }

  .loading-pulse {
    width: 40px;
    height: 3px;
    background: var(--ink);
    animation: pulse 1s ease-in-out infinite alternate;
  }

  @keyframes pulse {
    from { transform: scaleX(0.3); opacity: 0.3; }
    to   { transform: scaleX(1);   opacity: 1; }
  }

  .loading-text {
    font-family: var(--serif);
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .error-state {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-family: var(--serif);
  }

  .footer {
    border-top: 3px double var(--ink);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .footer strong {
    font-family: var(--serif);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0;
    text-transform: none;
  }

  @media (max-width: 700px) {
    .masthead { padding: 1rem; }
    .masthead h1 { font-size: 1.8rem; }
    .masthead-meta { display: none; }
    .main { padding: 1rem; }
    .hero-grid { grid-template-columns: 1fr; }
    .hero-card { border-right: none; border-bottom: 1px solid var(--border); }
    .grid-section { grid-template-columns: 1fr; }
    .grid-card { border-right: none; border-bottom: 1px solid var(--border); }
    .grid-card:last-child { border-bottom: none; }
    .filters { padding: 0.6rem 1rem; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>In the <span>Loop</span></h1>
  <div class="masthead-meta">
    <div id="today-date"></div>
    <div>World Edition</div>
  </div>
</header>

<div class="ticker-bar">
  <span class="ticker-label">Live</span>
  <div class="ticker-content">
    <span class="ticker-text" id="ticker-text">Loading latest headlines...</span>
  </div>
</div>

<nav class="filters">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="world">World</button>
  <button class="filter-btn" data-cat="politics">Politics</button>
  <button class="filter-btn" data-cat="business">Business</button>
  <button class="filter-btn" data-cat="technology">Technology</button>
  <button class="filter-btn" data-cat="health">Health</button>
  <button class="filter-btn" data-cat="science">Science</button>
  <button class="filter-btn" data-cat="sports">Sports</button>
  <button class="filter-btn" data-cat="entertainment">Entertainment</button>
</nav>

<main class="main" id="main-content">
  <div class="loading-state">
    <div class="loading-pulse"></div>
    <div class="loading-text">Gathering today's stories...</div>
  </div>
</main>

<footer class="footer">
  <strong>In the Loop</strong>
  <span>Powered by NewsData.io · <span id="footer-time"></span></span>
</footer>

<script>
let allArticles = [];

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } catch { return ''; }
}

function getTagClass(cat) {
  if (!cat) return '';
  const c = (Array.isArray(cat) ? cat[0] : cat).toLowerCase();
  if (c.includes('world') || c.includes('international')) return 'world';
  if (c.includes('business') || c.includes('finance') || c.includes('economy')) return 'business';
  if (c.includes('tech')) return 'technology';
  if (c.includes('health') || c.includes('medical')) return 'health';
  if (c.includes('science')) return 'science';
  if (c.includes('sport')) return 'sports';
  if (c.includes('entertainment') || c.includes('lifestyle')) return 'entertainment';
  if (c.includes('politics') || c.includes('government')) return 'politics';
  return '';
}

function getCatLabel(cat) {
  if (!cat) return 'News';
  return Array.isArray(cat) ? cat[0] : cat;
}

function makeCard(a, size) {
  const tag = getCatLabel(a.category);
  const tagCls = getTagClass(a.category);
  const date = formatDate(a.pubDate);
  const desc = a.description || '';
  const url = a.link || '#';
  const zh = a.chinese_summary || '';

  if (size === 'hero') return `
    <a class="hero-card" href="${url}" target="_blank" rel="noopener">
      <span class="tag ${tagCls}">${tag}</span>
      <div class="headline">${a.title}</div>
      ${zh ? `<div class="chinese-summary">${zh}</div>` : ''}
      ${desc ? `<div class="description">${desc}</div>` : ''}
      <div class="meta">${date}${a.source_id ? ' · ' + a.source_id : ''}</div>
    </a>`;

  if (size === 'side') return `
    <a class="side-card" href="${url}" target="_blank" rel="noopener">
      <span class="tag ${tagCls}">${tag}</span>
      <div class="headline">${a.title}</div>
      ${zh ? `<div class="chinese-summary" style="font-size:0.8rem">${zh}</div>` : ''}
      <div class="meta">${date}</div>
    </a>`;

  return `
    <a class="grid-card" href="${url}" target="_blank" rel="noopener">
      <span class="tag ${tagCls}">${tag}</span>
      <div class="headline">${a.title}</div>
      ${zh ? `<div class="chinese-summary" style="font-size:0.8rem">${zh}</div>` : ''}
      <div class="meta">${date}</div>
    </a>`;
}

function renderArticles(articles) {
  const main = document.getElementById('main-content');
  if (!articles.length) {
    main.innerHTML = `<div class="error-state"><p>No stories found for this category.</p></div>`;
    return;
  }
  const hero  = articles[0];
  const sides = articles.slice(1, 4);
  const grid  = articles.slice(4, 13);

  main.innerHTML = `
    <div class="section-rule"><span>Top Stories</span></div>
    <div class="hero-grid">
      ${makeCard(hero, 'hero')}
      <div class="side-cards">${sides.map(a => makeCard(a, 'side')).join('')}</div>
    </div>
    ${grid.length ? `
      <div class="section-rule"><span>More Headlines</span></div>
      <div class="grid-section">${grid.map(a => makeCard(a, 'grid')).join('')}</div>
    ` : ''}`;
}

async function fetchNews(category) {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="loading-state"><div class="loading-pulse"></div><div class="loading-text">Gathering today's stories...</div></div>`;

let url = `/.netlify/functions/news?placeholder=1`;
if (category && category !== 'all') url += `&category=${category}`;

  try {
    const res  = await fetch(url);
    const data = await res.json();
    if (data.status === 'success' && data.results) {
      allArticles = data.results;
      renderArticles(allArticles);
      document.getElementById('ticker-text').textContent =
        allArticles.slice(0, 8).map(a => a.title).join('   ·   ');
    } else {
      main.innerHTML = `<div class="error-state">
        <p>Could not load news.</p>
        <p style="font-size:0.8rem;margin-top:0.5rem;color:var(--accent)">${data.message || 'Unknown error'}</p>
      </div>`;
    }
  } catch (e) {
    main.innerHTML = `<div class="error-state"><p>Network error. Check your connection.</p></div>`;
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    fetchNews(btn.dataset.cat);
  });
});

const now = new Date();
document.getElementById('today-date').textContent =
  now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
document.getElementById('footer-time').textContent =
  'Updated ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

fetchNews('all');
</script>
</body>
</html>
